name: Cross-Stitch API Automation Pipeline

on:
  push:
    branches: [ main ]

jobs:
  execute-testing-suite:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - name: Check out the repository code layers
        uses: actions/checkout@v4

      - name: Configure the Python runtime environment
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install required application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pytest requests httpx

      - name: Run automated validation loops
        run: pytest test_main.py
